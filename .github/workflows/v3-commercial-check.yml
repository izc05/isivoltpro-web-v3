name: Validar rediseño comercial V3

on:
  push:
    branches:
      - feat/v3-smb-commercial-redesign
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Guardar build V3
        uses: actions/upload-artifact@v4
        with:
          name: isivoltpro-v3-commercial-dist
          path: dist
          if-no-files-found: error
