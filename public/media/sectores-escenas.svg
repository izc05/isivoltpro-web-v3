<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="320" viewBox="0 0 1800 320" role="img" aria-labelledby="title desc">
  <title id="title">Seis escenarios de mantenimiento para IsiVoltPro</title>
  <desc id="desc">Banda visual con escenas conceptuales distintas para autónomos, empresas mantenedoras, instalaciones propias, climatización y frío, electricidad y operación multisede.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#edf3ff"/><stop offset="1" stop-color="#dce6fa"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#effbf7"/><stop offset="1" stop-color="#d8f4e9"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3efff"/><stop offset="1" stop-color="#e5dcff"/></linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff4ec"/><stop offset="1" stop-color="#ffe2cf"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ecf9fc"/><stop offset="1" stop-color="#d5f1f6"/></linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#263653"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#253456" flood-opacity=".14"/></filter>
  </defs>

  <!-- 1 · Autónomo -->
  <g transform="translate(0 0)">
    <rect width="300" height="320" fill="url(#sky)"/>
    <circle cx="246" cy="64" r="72" fill="#fff" opacity=".46"/>
    <rect x="24" y="188" width="252" height="92" rx="18" fill="#fff" opacity=".9"/>
    <rect x="45" y="202" width="86" height="58" rx="12" fill="#eef3ff"/>
    <circle cx="87" cy="139" r="31" fill="#f2b18f"/><path d="M49 206c4-46 19-67 39-67 24 0 42 24 45 67Z" fill="#3967df"/>
    <rect x="111" y="142" width="57" height="86" rx="12" fill="#121b30" transform="rotate(8 111 142)"/>
    <rect x="118" y="150" width="43" height="61" rx="7" fill="#f8fbff" transform="rotate(8 118 150)"/>
    <circle cx="139" cy="182" r="8" fill="#2ac08a"/>
    <rect x="183" y="209" width="63" height="10" rx="5" fill="#cad7ef"/><rect x="183" y="229" width="43" height="8" rx="4" fill="#dce5f4"/>
  </g>

  <!-- 2 · Mantenedora -->
  <g transform="translate(300 0)">
    <rect width="300" height="320" fill="url(#violet)"/>
    <rect x="30" y="60" width="240" height="180" rx="24" fill="#fff" filter="url(#s)"/>
    <rect x="48" y="78" width="204" height="18" rx="9" fill="#eef0f6"/>
    <circle cx="85" cy="138" r="23" fill="#f2b18f"/><path d="M57 193c4-39 13-56 28-56 17 0 29 20 31 56Z" fill="#6d4aff"/>
    <circle cx="155" cy="134" r="23" fill="#d79a76"/><path d="M128 193c4-40 13-57 28-57 18 0 30 20 32 57Z" fill="#2f8ac5"/>
    <circle cx="222" cy="140" r="23" fill="#f1b08d"/><path d="M195 193c4-39 13-56 28-56 17 0 29 20 31 56Z" fill="#24a97a"/>
    <path d="M88 221h134" stroke="#e8eaf2" stroke-width="10" stroke-linecap="round"/><path d="M88 221h89" stroke="#7258de" stroke-width="10" stroke-linecap="round"/>
    <circle cx="128" cy="221" r="10" fill="#fff" stroke="#7258de" stroke-width="4"/><circle cx="178" cy="221" r="10" fill="#fff" stroke="#25b482" stroke-width="4"/>
  </g>

  <!-- 3 · Instalaciones propias -->
  <g transform="translate(600 0)">
    <rect width="300" height="320" fill="url(#mint)"/>
    <rect x="34" y="105" width="232" height="145" rx="18" fill="#fff" filter="url(#s)"/>
    <rect x="53" y="126" width="73" height="91" rx="8" fill="#dcebf0"/><rect x="139" y="126" width="107" height="91" rx="8" fill="#edf5f7"/>
    <rect x="70" y="83" width="38" height="32" rx="5" fill="#7d9fab"/><rect x="83" y="52" width="13" height="36" rx="5" fill="#8aa7b1"/>
    <circle cx="195" cy="167" r="28" fill="#d9f3e9"/><circle cx="195" cy="167" r="14" fill="#29b984"/><path d="M185 167l7 7 14-17" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="54" y="232" width="190" height="8" rx="4" fill="#cbded7"/>
  </g>

  <!-- 4 · Climatización / frío -->
  <g transform="translate(900 0)">
    <rect width="300" height="320" fill="url(#cyan)"/>
    <rect x="35" y="72" width="230" height="178" rx="22" fill="#fff" filter="url(#s)"/>
    <rect x="60" y="96" width="180" height="88" rx="14" fill="#e9f3f8"/>
    <circle cx="112" cy="140" r="29" fill="#c9dde8"/><circle cx="188" cy="140" r="29" fill="#c9dde8"/>
    <path d="M112 117c17 10 17 36 0 46-17-10-17-36 0-46Zm76 0c17 10 17 36 0 46-17-10-17-36 0-46Z" fill="#7ca8bc" opacity=".85"/>
    <rect x="68" y="202" width="112" height="10" rx="5" fill="#c7dce6"/><rect x="68" y="220" width="77" height="8" rx="4" fill="#dbe8ee"/>
    <circle cx="218" cy="216" r="18" fill="#ebfafa" stroke="#25a9c4" stroke-width="5"/><path d="M218 205v12l8 5" fill="none" stroke="#25a9c4" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- 5 · Electricidad -->
  <g transform="translate(1200 0)">
    <rect width="300" height="320" fill="url(#warm)"/>
    <rect x="42" y="56" width="216" height="204" rx="22" fill="#fff" filter="url(#s)"/>
    <rect x="67" y="83" width="166" height="135" rx="13" fill="#f3f5f8" stroke="#dce2ea"/>
    <g fill="#37445c"><rect x="82" y="100" width="18" height="46" rx="4"/><rect x="108" y="100" width="18" height="46" rx="4"/><rect x="134" y="100" width="18" height="46" rx="4"/><rect x="160" y="100" width="18" height="46" rx="4"/><rect x="186" y="100" width="18" height="46" rx="4"/></g>
    <g fill="#31b985"><circle cx="91" cy="170" r="7"/><circle cx="117" cy="170" r="7"/></g><g fill="#e68a42"><circle cx="143" cy="170" r="7"/></g>
    <path d="M197 181l-22 30h16l-11 29 32-38h-18Z" fill="#f2a43b"/>
    <rect x="71" y="231" width="114" height="9" rx="4.5" fill="#e4e7ec"/>
  </g>

  <!-- 6 · Multisede -->
  <g transform="translate(1500 0)">
    <rect width="300" height="320" fill="url(#dark)"/>
    <circle cx="65" cy="83" r="42" fill="#5c64f0" opacity=".28"/><circle cx="245" cy="236" r="66" fill="#2ec48d" opacity=".17"/>
    <path d="M72 221C110 161 154 142 224 96" fill="none" stroke="#6475ef" stroke-width="5" stroke-linecap="round"/>
    <path d="M72 221C126 207 173 212 232 238" fill="none" stroke="#31bb8c" stroke-width="4" stroke-linecap="round" opacity=".8"/>
    <g fill="#fff" filter="url(#s)"><rect x="42" y="189" width="82" height="59" rx="14"/><rect x="108" y="100" width="82" height="59" rx="14"/><rect x="190" y="54" width="72" height="55" rx="14"/><rect x="196" y="215" width="72" height="55" rx="14"/></g>
    <g fill="#31405f"><circle cx="67" cy="218" r="8"/><circle cx="133" cy="129" r="8"/><circle cx="215" cy="81" r="8"/><circle cx="221" cy="242" r="8"/></g>
    <g fill="#24bd8a"><circle cx="97" cy="218" r="5"/><circle cx="163" cy="129" r="5"/><circle cx="242" cy="81" r="5"/><circle cx="248" cy="242" r="5"/></g>
  </g>

  <g opacity=".38" stroke="#fff"><path d="M300 0v320M600 0v320M900 0v320M1200 0v320M1500 0v320"/></g>
</svg>