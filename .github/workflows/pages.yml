name: Validar y publicar IsiVoltPro Web V3

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-v3
  cancel-in-progress: true

env:
  PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://izc05.github.io' }}
  PUBLIC_BASE_PATH: ${{ vars.PUBLIC_BASE_PATH || '/isivoltpro-web-v3' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        name: Publicar
        uses: actions/deploy-pages@v4
