name: Radar editorial diario V4

on:
  schedule:
    # 06:00 UTC = primera hora de la mañana en España; cambia una hora con horario de verano/invierno.
    - cron: '0 6 * * *'
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  issues: write

concurrency:
  group: v4-daily-editorial-radar-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar cliente de IA
        run: python -m pip install --disable-pip-version-check 'openai>=1,<3'

      - name: Validar sintaxis del motor
        run: python -m py_compile scripts/v4-daily-editorial-radar.py

      - name: Descubrir fuentes y preparar borrador
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5-mini
          V4_EDITORIAL_RADAR_DIR: editorial-radar-output
        run: python scripts/v4-daily-editorial-radar.py

      - name: Guardar evidencia del radar
        uses: actions/upload-artifact@v4
        with:
          name: v4-editorial-radar-${{ github.run_id }}
          path: editorial-radar-output
          if-no-files-found: error
          retention-days: 30

      - name: Crear o actualizar borrador editorial en GitHub
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE="$(tr -d '\n' < editorial-radar-output/title.txt)"
          EXISTING="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --repo "$GITHUB_REPOSITORY" --body-file editorial-radar-output/radar.md
            echo "Borrador actualizado: issue #$EXISTING"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file editorial-radar-output/radar.md
          fi

      - name: Confirmar que no existe publicación automática
        run: |
          test ! -f editorial-radar-output/publish.flag
          echo 'OK: el radar genera revisión interna; no publica en la web ni en redes.'
